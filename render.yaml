services:
  - type: web
    name: adlab
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: node server.mjs
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: ARK_API_KEY
        sync: false
      - key: ARK_IMAGE_MODEL
        sync: false
      - key: ARK_IMAGE_API_URL
        value: https://ark.cn-beijing.volces.com/api/v3/images/generations
